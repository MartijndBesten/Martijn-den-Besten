name: CI en deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests en build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Playwright-browser installeren
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (lokale Worker + D1)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-resultaten
          path: test-results
          retention-days: 7

  deploy:
    name: Deploy naar Cloudflare
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c5472db2163a42a463916a6a525d8353
    steps:
      - name: Controleer of het deploy-token is ingesteld
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN ontbreekt; deployment overgeslagen. Zie docs/DEPLOYMENT.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.token.outputs.present == 'true'
        run: npm ci
      - if: steps.token.outputs.present == 'true'
        run: npm run build
      - name: Databasemigraties
        if: steps.token.outputs.present == 'true'
        run: npx wrangler d1 migrations apply martijndenbesten --remote
      - name: Deploy hoofdsite
        if: steps.token.outputs.present == 'true'
        run: npx wrangler deploy
      - name: Deploy www-doorverwijzing
        if: steps.token.outputs.present == 'true'
        run: npx wrangler deploy -c wrangler.www.jsonc
      - name: Rooktest productie
        if: steps.token.outputs.present == 'true'
        run: |
          sleep 10
          curl -fsS https://martijndenbesten.com/api/health
          curl -fsS -o /dev/null -w "%{http_code}\n" https://martijndenbesten.com/
