name: CI en deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests en build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Playwright-browser installeren
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (lokale Worker + D1)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-resultaten
          path: test-results
          retention-days: 7

  visueel:
    name: Visuele regressie (vast Playwright-image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Zelfde image (op digest) als scripts/visueel.sh: browser, besturingssysteem en lettertypen lokaal en in de CI gelijk.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      HOME: /root
      CI: "1"
      BIJBELREIS_VISUEEL: "1"
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - name: Visuele regressietest Bijbelreis
        run: npx playwright test e2e/bijbelreis-visueel.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visuele-verschillen
          path: test-results
          retention-days: 7

  deploy:
    name: Deploy naar Cloudflare
    needs: [check, visueel]
    # Bij elke push naar main, of handmatig via ‘Run workflow’ in het tabblad Actions.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: productie
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c5472db2163a42a463916a6a525d8353
    steps:
      - name: Controleer of het deploy-token is ingesteld
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN ontbreekt; deployment overgeslagen. Zie docs/DEPLOYMENT.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.token.outputs.present == 'true'
        run: npm ci
      - if: steps.token.outputs.present == 'true'
        run: npm run build
      - name: Token en rechten controleren
        if: steps.token.outputs.present == 'true'
        run: npx wrangler whoami
      - name: Databasemigraties
        if: steps.token.outputs.present == 'true'
        run: npx wrangler d1 migrations apply martijndenbesten --remote
      - name: Deploy hoofdsite (Workers Static Assets)
        if: steps.token.outputs.present == 'true'
        # Bestaande Worker-secrets (ADMIN_TOKEN, HASH_SECRET) blijven bij een deploy behouden.
        run: npx wrangler deploy
      - name: Deploy www-doorverwijzing
        if: steps.token.outputs.present == 'true'
        run: npx wrangler deploy -c wrangler.www.jsonc
      - name: Rooktest productie
        if: steps.token.outputs.present == 'true'
        run: |
          sleep 15
          curl -fsS https://martijndenbesten.com/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' https://martijndenbesten.com/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://martijndenbesten.com/bestaat-niet)" = "404"
          test "$(curl -s -o /dev/null -w '%{redirect_url}' https://www.martijndenbesten.com/museum)" = "https://martijndenbesten.com/museum"
      - name: Playwright-browser installeren
        if: steps.token.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests op productie (zonder schrijvende tests)
        if: steps.token.outputs.present == 'true'
        env:
          E2E_BASE_URL: https://martijndenbesten.com
        run: npx playwright test --grep-invert "stemmen telt|moderatieflow|ideeëngenerator vult|loket weigert"
      - name: Hulp bij een mislukte deploy
        if: failure() && steps.token.outputs.present == 'true'
        run: |
          echo "::error::De productiecontrole is mislukt. Vorige versie terugzetten: npx wrangler rollback (zie docs/DEPLOYMENT.md)."
      - uses: actions/upload-artifact@v4
        if: failure() && steps.token.outputs.present == 'true'
        with:
          name: productie-testresultaten
          path: test-results
          retention-days: 7
