    <g fill="#e7f1f9"><circle cx="322" cy="818" r="3"/><circle cx="628" cy="820" r="3"/><circle cx="560" cy="804" r="2.5"/><circle cx="388" cy="812" r="2.5"/><circle cx="668" cy="822" r="2"/></g>
