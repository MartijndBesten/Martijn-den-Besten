        <path d="M680 320 C 650 360 652 420 684 460" stroke-width="12"/>
        <path d="M300 720 C 380 700 520 700 640 724" stroke-width="12"/>
        <path d="M270 640 C 300 660 330 690 340 740" stroke-width="8"/>
