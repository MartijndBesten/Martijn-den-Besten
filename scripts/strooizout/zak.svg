      <!-- etiket -->
      <rect x="200" y="372" width="540" height="270" fill="url(#band)"/>
      <rect x="200" y="372" width="540" height="6" fill="#ffffff" opacity="0.18"/>
      <rect x="200" y="636" width="540" height="6" fill="#000000" opacity="0.12"/>
      <g transform="translate(470 432)" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M0-38v76M-33-19l66 38M-33 19l66-38"/>
        <path d="M-10-30l10 8 10-8M-10 30l10-8 10 8M-30-6l12-1-4-12M30 6l-12 1 4 12M-30 6l12 1-4 12M30-6l-12-1 4-12" stroke-width="5"/>
      </g>
      <text x="470" y="540" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-weight="800" font-size="60" letter-spacing="5" fill="#ffffff">STROOIZOUT</text>
      <rect x="378" y="566" width="184" height="52" rx="26" fill="#ffffff"/>
      <text x="470" y="604" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-weight="800" font-size="36" fill="#0f2c4c">25 kg</text>
