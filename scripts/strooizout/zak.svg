<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 940" width="940" height="940">
  <defs>
    <radialGradient id="bg" cx="70%" cy="20%" r="95%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#eaf3fa"/>
      <stop offset="1" stop-color="#c9dfef"/>
    </radialGradient>
    <linearGradient id="vloer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe9f4" stop-opacity="0"/>
      <stop offset="1" stop-color="#b8d2e6" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="schaduw" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0f2c4c" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#0f2c4c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0f2c4c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9e2ea"/>
      <stop offset="0.12" stop-color="#f4f7fa"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#eef3f7"/>
      <stop offset="1" stop-color="#c5d2de"/>
    </linearGradient>
    <linearGradient id="zakV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2c4c" stop-opacity="0.10"/>
      <stop offset="0.18" stop-color="#0f2c4c" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#0f2c4c" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f2c4c" stop-opacity="0.16"/>
