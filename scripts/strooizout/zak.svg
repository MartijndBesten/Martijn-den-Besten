    <!-- bovennaad -->
    <path d="M226 212 C 300 196 640 196 714 212 L 716 252 C 640 238 300 238 224 252 Z" fill="url(#naad)"/>
    <path d="M236 232 C 320 220 620 220 704 232" stroke="#8ea4b8" stroke-width="3" stroke-dasharray="9 7" fill="none" opacity="0.8"/>
